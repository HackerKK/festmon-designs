<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FestMon · D · Аврора</title>
<link rel="stylesheet" href="assets/panels.css">
<style>
/* По референсу: тёмно-фиолетовый, градиентные акценты, скруглённые карточки, мягкие тени.
 * Контраст текста поднят под тёмный зал: основной текст ≥ 12:1, подписи ≥ 5:1. */
:root {
  --bg1: #2b2775; --bg2: #18164a; --card: #25226a; --card2: #2e2a7c; --field: #1a1852;
  --panel2: #332f86; --border: rgba(255,255,255,.08); --text: #ffffff; --dim: #b4b0e6;
  --grad: linear-gradient(120deg, #d44dff 0%, #8a5cff 55%, #5b6dff 100%);
  --accent: #b46bff; --accent-fg: #fff; --pink: #ff8fa3; --ok: #4fe3a0; --warn: #ffcf5a; --bad: #ff5c7a;
  --live: #ff5c9a; --next: #8fb4ff;
  --r: 14px; --shadow: 0 18px 40px rgba(8,6,40,.45); --side: 380px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; color: var(--text); font: 14px/1.4 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
body { background: radial-gradient(1200px 700px at 15% -10%, #3d37a0 0%, transparent 60%), radial-gradient(900px 600px at 100% 110%, #3a1f7a 0%, transparent 60%), linear-gradient(160deg, var(--bg1), var(--bg2)); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,.05) 2px, transparent 2px); background-size: 34px 34px; mask-image: linear-gradient(90deg, #000 0 8%, transparent 25%); }
button { font-family: inherit; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }

.shell { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0,1fr) var(--side); grid-template-rows: minmax(0,1fr); gap: 18px; padding: 18px; transition: grid-template-columns .25s; }
body.noside .shell { grid-template-columns: minmax(0,1fr) 0; gap: 0; }
.main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 16px; min-width: 0; min-height: 0; }

/* ---------- шапка ---------- */
.head { display: flex; align-items: center; gap: 14px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px; background: var(--card); font-size: 13px; color: var(--dim); box-shadow: var(--shadow); }
.chip b { color: var(--text); }
.chip.live { background: linear-gradient(120deg, #ff4f8b, #ff7a59); color: #fff; font-weight: 800; letter-spacing: .1em; }
.chip.live i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: bl 1.2s infinite; }
.chip.paused { background: #4a3d16; color: var(--warn); font-weight: 800; }
.chip.standby { background: #233a7a; color: var(--next); font-weight: 800; }
.chip.off { color: var(--dim); font-weight: 800; }
@keyframes bl { 50% { opacity: .3; } }
.head .sp { flex: 1; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--text); font-size: 16px; cursor: pointer; box-shadow: var(--shadow); position: relative; }
.round:hover { background: var(--card2); }
.round.on { background: var(--grad); }
.round[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: 46px; right: 0; white-space: nowrap; background: #120f3a; padding: 5px 10px; border-radius: 8px; font-size: 12px; z-index: 30; }

/* ---------- сцена: «сейчас» + мониторы ---------- */
.stage { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; min-height: 0; }
.nowc { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 24px; background: var(--grad); box-shadow: 0 24px 50px rgba(150,60,255,.35); display: flex; flex-direction: column; min-height: 0; }
.nowc::before { content: ""; position: absolute; right: -80px; top: -60px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); }
.nowc::after { content: ""; position: absolute; left: -40px; bottom: -120px; width: 380px; height: 260px; border-radius: 50%; background: rgba(60,30,180,.35); }
.nowc > * { position: relative; z-index: 1; }
.nowc .k { font-size: 12px; letter-spacing: .18em; font-weight: 700; opacity: .85; }
.nowc .n { margin-top: 14px; font-size: 14px; opacity: .85; }
.nowc .t { font-size: 32px; font-weight: 800; line-height: 1.1; }
.nowc .s { opacity: .85; }
.nowc .sp { flex: 1; }
.nowc .tm { display: flex; justify-content: space-between; align-items: flex-end; }
.nowc .tm small { display: block; font-size: 11px; letter-spacing: .14em; opacity: .8; }
.nowc .tm b { font: 700 46px/1 "Segoe UI Variable Display", "Segoe UI"; letter-spacing: .02em; }
.nowc .tm .el b { font-size: 22px; }
.nowc .pr { height: 6px; border-radius: 6px; background: rgba(255,255,255,.25); margin-top: 14px; overflow: hidden; }
.nowc .pr i { display: block; height: 100%; background: #fff; border-radius: 6px; transition: width 1s linear; }
.nowc.low .tm b.rem { color: #fff3a8; }

.mon { padding: 14px; display: flex; flex-direction: column; min-height: 0; }
.mon-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.mon-h .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
.mon.pgm .ic { background: linear-gradient(135deg, #ff4f8b, #ff7a59); }
.mon.pvw .ic { background: linear-gradient(135deg, #7d6bff, #5aa2ff); }
.mon-h b { font-size: 15px; }
.mon-h span { color: var(--dim); font-size: 12px; }
.mon-h .sp { flex: 1; }
.scr { flex: 1; min-height: 0; display: grid; place-items: center; border-radius: 16px; background: #0b0a24; overflow: hidden; }
.scr .box { position: relative; width: 100%; aspect-ratio: 16/9; max-height: 100%; }
.scr img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scr .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 10px; background: linear-gradient(transparent, rgba(10,8,40,.85)); font-weight: 700; }
.scr .cap span { color: var(--dim); font-weight: 400; margin-left: 6px; }
.scr .sb { position: absolute; inset: 0; display: none; place-items: center; background: var(--grad); font-weight: 800; font-size: 28px; letter-spacing: .3em; }
.pgm.standby .sb { display: grid; }
.pgm.on .scr { box-shadow: 0 0 0 3px #ff5c9a, 0 0 30px rgba(255,92,154,.35); }

/* ---------- пульт ---------- */
.deck { display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 16px 20px; align-items: center; }
.btns { display: flex; align-items: center; gap: 14px; }
.tb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 12px; font-weight: 600; }
.tb .o { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: #fff; background: var(--card2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: transform .08s, box-shadow .2s; }
.tb:hover .o { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.tb:active .o { transform: scale(.94); }
.tb kbd { position: absolute; top: -4px; right: -2px; font: 600 10px Consolas, monospace; background: #120f3a; color: var(--dim); border-radius: 5px; padding: 0 4px; }
.tb.play .o { width: 92px; height: 92px; font-size: 32px; background: var(--grad); box-shadow: 0 12px 30px rgba(180,80,255,.5); }
.tb.play { color: #fff; }
.tb.play.on .o { box-shadow: 0 0 0 5px rgba(212,77,255,.3), 0 12px 30px rgba(180,80,255,.5); }
.tb.pause.on .o { background: #6b5516; color: var(--warn); }
.tb.stop .o { background: #5a1f45; color: #ff9fb6; }
.tb.next .o { width: 76px; height: 76px; font-size: 26px; background: linear-gradient(135deg, #5b6dff, #46a6ff); }
.tb.next { color: #fff; }
.tb.standby.on .o { background: #233a7a; color: var(--next); box-shadow: inset 0 0 0 2px var(--next); }
.mix { display: grid; grid-template-columns: 72px 1fr 52px; gap: 10px 14px; align-items: center; }
.mix > span { color: var(--dim); font-size: 12px; font-weight: 600; }
.mix > b { font-weight: 700; text-align: right; }
input[type=range].gr { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 10px; background: linear-gradient(90deg, #d44dff, #5b6dff) 0 / var(--v, 50%) 100% no-repeat, var(--field); outline: none; }
input[type=range].gr::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.4); cursor: pointer; }
.meter { position: relative; height: 10px; border-radius: 10px; background: var(--field); overflow: hidden; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 10px; background: linear-gradient(90deg, #4fe3a0 0%, #4fe3a0 65%, #ffcf5a 80%, #ff5c7a 95%); transition: width .08s; }
.meter .peak { position: absolute; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: #fff; }
.meter .db { display: none; }

/* ---------- таймлайн ---------- */
.tlw { padding: 14px 0 14px 20px; }
.tlh { display: flex; align-items: center; gap: 12px; padding-right: 20px; margin-bottom: 10px; }
.tlh h2 { margin: 0; font-size: 17px; }
.tlh .sp { flex: 1; }
.tlh button { background: var(--card2); border: 0; color: var(--text); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 12px; }
.tl { display: flex; gap: 14px; overflow-x: auto; padding: 4px 20px 8px 2px; scroll-behavior: smooth; }
.it { flex: none; width: 184px; border-radius: 18px; background: var(--card2); padding: 10px; cursor: pointer; position: relative; transition: transform .15s, box-shadow .15s; }
.it:hover { transform: translateY(-2px); }
.it img { width: 100%; height: 88px; object-fit: cover; border-radius: 12px; display: block; }
.it .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.it .row .t { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .row .d { font-size: 12px; color: var(--dim); }
.it .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .st { position: absolute; top: 16px; left: 16px; font-size: 10px; font-weight: 800; letter-spacing: .1em; padding: 3px 9px; border-radius: 99px; }
.it.done { opacity: .45; }
.it.live { background: linear-gradient(160deg, #4a2ba8, #36257f); box-shadow: 0 0 0 2px #ff5c9a, 0 14px 30px rgba(255,92,154,.25); }
.it.live .st { background: linear-gradient(120deg, #ff4f8b, #ff7a59); }
.it.next { box-shadow: 0 0 0 2px var(--next); }
.it.next .st { background: #2b4ea8; }
.it.sel { outline: 2px dashed #fff; outline-offset: 3px; }
.ring { width: 34px; height: 34px; flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bgc { stroke: rgba(255,255,255,.15); }
.ring .fg { stroke: #ff8fb8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }

/* ---------- боковые карточки ---------- */
.side { min-width: 0; overflow: hidden auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
body.noside .side { visibility: hidden; }
.prof { padding: 16px; display: flex; align-items: center; gap: 12px; }
.prof .av { width: 46px; height: 46px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-weight: 800; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
.prof b { display: block; }
.prof span { color: var(--dim); font-size: 12px; }
.prof .sp { flex: 1; }
.pill { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 99px; background: var(--grad); box-shadow: 0 12px 26px rgba(180,80,255,.35); cursor: pointer; border: 0; color: #fff; font-size: 13px; width: 100%; text-align: left; }
.pill b { font-size: 16px; }
.pill span { opacity: .85; flex: 1; }
.acc { overflow: hidden; }
.acc-h { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; user-select: none; }
.acc-h .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; flex: none; }
.acc-h .tt { flex: 1; min-width: 0; }
.acc-h .tt b { display: block; font-size: 14px; }
.acc-h .tt span { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.acc-h .ch { color: var(--dim); transition: transform .2s; }
.acc.open .acc-h .ch { transform: rotate(90deg); }
.acc-h kbd { font: 600 10px Consolas, monospace; color: var(--dim); background: var(--field); border-radius: 5px; padding: 1px 5px; }
.acc-b { display: none; padding: 0 16px 16px; }
.acc.open .acc-b { display: block; }
.acc .bd { background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 7px; }
.i1 { background: linear-gradient(135deg, #ff9fb0, #ff7a8f); } .i2 { background: linear-gradient(135deg, #b98bff, #8a5cff); }
.i3 { background: linear-gradient(135deg, #6fd3ff, #5b6dff); } .i4 { background: linear-gradient(135deg, #ffcf5a, #ff8f5a); }
.i5 { background: linear-gradient(135deg, #ff8fd8, #d44dff); } .i6 { background: linear-gradient(135deg, #7cf2c8, #3fb6a0); }
.vis { padding: 6px 6px; }
.vis .vh { padding: 10px 12px 4px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.vis label { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer; }
.vis label:hover { background: rgba(255,255,255,.04); }
.vis label span { flex: 1; }
.vis.closed { display: none; }

/* панели внутри — под стиль */
.side .p-row:hover, .side .p-row.p-active { background: rgba(255,255,255,.06); }
.side .p-quick { background: var(--card2); border: 0; border-radius: 16px; }
.side .p-req { background: var(--card2); border-radius: 14px; }
.side .p-now { background: var(--card2); border-radius: 16px; }
.side .p-search, .side select, .side textarea { border: 0; background: var(--field); border-radius: 12px; }
.side .p-sec { border-color: rgba(255,255,255,.07); }
.side .p-sec-h { color: var(--pink); }
.side .p-switch i { border: 0; }
.side .p-switch input:checked + i { background: var(--grad); }
.side .p-chip { background: var(--card2); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <div class="head">
      <h1><span>Fest</span>Mon</h1>
      <span class="chip live" id="lamp"><i></i>В ЭФИРЕ</span>
      <span class="chip">Блок 1 · <b id="pos"></b></span>
      <span class="chip">веб :50011 · <b style="color:var(--ok)">онлайн</b></span>
      <span class="sp"></span>
      <span class="chip"><b id="clk"></b></span>
      <button class="round" id="bFocus" data-tip="Только эфир (F11)">⛶</button>
      <button class="round on" id="bSide" data-tip="Боковые карточки (Ctrl+\)">☰</button>
    </div>
    <section class="stage">
      <div class="nowc" id="nowc">
        <div class="k">СЕЙЧАС НА СЦЕНЕ</div>
        <div class="n" id="nowN"></div><div class="t" id="nowT"></div><div class="s" id="nowS"></div>
        <div class="sp"></div>
        <div class="tm"><div class="el"><small>ПРОШЛО</small><b id="el"></b></div><div style="text-align:right"><small>ОСТАЛОСЬ</small><b class="rem" id="rem"></b></div></div>
        <div class="pr"><i id="pr"></i></div>
      </div>
      <div class="card mon pgm" id="pgm">
        <div class="mon-h"><span class="ic">◉</span><div><b>Экран</b><br><span>зеркало проектора · 1920×1080</span></div><span class="sp"></span><span id="pgmTc"></span></div>
        <div class="scr"><div class="box"><img id="pgmImg" alt=""><div class="cap" id="pgmCap"></div><div class="sb">FESTMON</div></div></div>
      </div>
      <div class="card mon pvw">
        <div class="mon-h"><span class="ic">◎</span><div><b>Предпросмотр</b><br><span>пойдёт следующим</span></div><span class="sp"></span><span id="pvwD"></span></div>
        <div class="scr"><div class="box"><img id="pvwImg" alt=""><div class="cap" id="pvwCap"></div></div></div>
      </div>
    </section>
    <section class="card deck">
      <div class="btns">
        <button class="tb stop" data-tr="stop"><span class="o">■</span>Стоп<kbd>⇧S</kbd></button>
        <button class="tb pause" data-tr="pause"><span class="o">❚❚</span>Пауза<kbd>P</kbd></button>
        <button class="tb play" data-tr="play"><span class="o">▶</span>Пуск<kbd>Space</kbd></button>
        <button class="tb next" data-tr="next"><span class="o">⏭</span>Следующий<kbd>N</kbd></button>
        <button class="tb standby" data-tr="standby"><span class="o">▣</span>Заставка<kbd>B</kbd></button>
      </div>
      <div class="mix">
        <span>Мастер</span><input type="range" class="gr" id="master" min="0" max="100"><b id="mV"></b>
        <span>Уровень</span><div class="meter" id="meter"><div class="fill"></div><div class="peak"></div><span class="db"></span></div><b id="dbV" style="font-size:12px;color:var(--dim)"></b>
        <span>Фон</span><input type="range" class="gr" id="bed" min="0" max="100"><b id="bV"></b>
      </div>
    </section>
    <section class="card tlw">
      <div class="tlh"><h2>Программа</h2><span class="p-dim" id="tlSum"></span><span class="sp"></span><button id="toLive">⌖ К идущему</button><button data-act="Добавить номер">＋ Номер</button></div>
      <div class="tl" id="tl"></div>
    </section>
  </div>

  <aside class="side" id="side">
    <div class="card prof"><div class="av">Оп</div><div><b>Оператор</b><span>Фестиваль · 30 ноября</span></div><span class="sp"></span><button class="round" style="box-shadow:none;background:var(--card2)" data-act="Настройки">⚙</button></div>
    <button class="pill" id="allBtn"><b>панели</b><span id="allSub"></span>›</button>
    <div class="card vis closed" id="vis"><div class="vbody"><div class="vh">Показывать карточки</div><div id="visList"></div></div></div>
    <div id="accs" style="display:flex;flex-direction:column;gap:12px"></div>
  </aside>
</div>

<script src="assets/common.js"></script>
<script src="assets/panels.js"></script>
<script>
(function () {
  const { PROGRAM, PANELS, state, mmss, cover } = FM;
  const $ = (s) => document.querySelector(s);
  const SUB = { inspector: "Свойства выбранного номера", files: "Папка «пример файлов»", bed: "Sakura Breeze · играет", quick: "6 кнопок · Q–Y", requests: "3 новых", plugins: "VK · Webhook · Файл" };

  // ---------- карточки-аккордеоны ----------
  let ui = FM.store.get("d-ui", null) || { side: true, open: ["quick", "requests"], shown: PANELS.map((p) => p.id) };
  const save = () => FM.store.set("d-ui", ui);
  function render() {
    document.body.classList.toggle("noside", !ui.side);
    $("#bSide").classList.toggle("on", ui.side);
    $("#accs").innerHTML = PANELS.filter((p) => ui.shown.includes(p.id)).map((p, i) => `
      <div class="card acc ${ui.open.includes(p.id) ? "open" : ""}" data-acc="${p.id}">
        <div class="acc-h" data-toggle="${p.id}"><span class="ic i${PANELS.indexOf(p) + 1}">${p.icon}</span>
          <div class="tt"><b>${p.title}</b><span>${SUB[p.id]}</span></div>${p.badge ? `<span class="bd">${p.badge}</span>` : ""}<kbd>${p.key}</kbd><span class="ch">›</span></div>
        <div class="acc-b">${ui.open.includes(p.id) ? FM.renderPanel(p.id) : ""}</div></div>`).join("");
    $("#visList").innerHTML = PANELS.map((p) => `<label><span>${p.icon}&nbsp; ${p.title}</span><span class="p-switch"><input type="checkbox" data-vis="${p.id}" ${ui.shown.includes(p.id) ? "checked" : ""}><i></i></span></label>`).join("");
    $("#allSub").textContent = `${ui.shown.length} из ${PANELS.length} показано · ${ui.open.length} раскрыто`;
    save();
  }
  function toggle(id) {
    if (!ui.side) ui.side = true;
    if (!ui.shown.includes(id)) ui.shown.push(id);
    ui.open = ui.open.includes(id) ? ui.open.filter((x) => x !== id) : [...ui.open, id];
    render();
    if (ui.open.includes(id)) { const el = document.querySelector(`[data-acc="${id}"]`); FM.reveal(el, $("#side"), "y"); }
  }
  document.addEventListener("click", (e) => { const h = e.target.closest("[data-toggle]"); if (h) toggle(h.dataset.toggle); });
  document.addEventListener("change", (e) => {
    const id = e.target.dataset.vis; if (!id) return;
    ui.shown = e.target.checked ? [...ui.shown, id] : ui.shown.filter((x) => x !== id);
    ui.open = ui.open.filter((x) => ui.shown.includes(x)); render();
  });
  $("#allBtn").onclick = () => $("#vis").classList.toggle("closed");
  $("#bSide").onclick = () => { ui.side = !ui.side; render(); };
  let focusSaved = null;
  $("#bFocus").onclick = () => {
    if (focusSaved) { ui.side = focusSaved.side; ui.open = focusSaved.open; focusSaved = null; }
    else { focusSaved = { side: ui.side, open: ui.open.slice() }; ui.side = false; }
    $("#bFocus").classList.toggle("on", !!focusSaved); render();
  };

  // ---------- таймлайн ----------
  const C = 2 * Math.PI * 14;
  function ring(p) { return `<svg class="ring" viewBox="0 0 34 34"><circle class="bgc" cx="17" cy="17" r="14"/><circle class="fg" cx="17" cy="17" r="14" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - state.elapsed / p.dur)}"/></svg>`; }
  function renderTl() {
    $("#tl").innerHTML = PROGRAM.map((p, i) => {
      const st = { live: "ИДЁТ", next: "ДАЛЕЕ" }[p.status];
      return `<div class="it ${p.status} ${state.sel === i ? "sel" : ""}" data-i="${i}"><img src="${cover(p)}" alt="">${st ? `<span class="st">${st}</span>` : ""}
        <div class="row">${p.status === "live" ? ring(p) : ""}<div style="min-width:0;flex:1"><div class="t">${p.n} ${p.title}</div><div class="sub">${p.sub}</div></div><span class="d">${mmss(p.dur)}</span></div></div>`;
    }).join("");
    $("#tlSum").textContent = `${PROGRAM.length} позиций · ${Math.round(PROGRAM.reduce((a, p) => a + p.dur, 0) / 60)} мин`;
  }
  $("#tl").addEventListener("click", (e) => {
    const c = e.target.closest(".it"); if (!c) return;
    state.sel = +c.dataset.i; renderTl();
    if (!ui.open.includes("inspector")) toggle("inspector"); else render();
  });
  $("#toLive").onclick = () => { const c = $(".it.live"); FM.reveal(c, $("#tl")); };

  // ---------- эфир ----------
  document.querySelectorAll("[data-tr]").forEach((b) => (b.onclick = () => FM.transport(b.dataset.tr)));
  const sl = (el, kind) => { el.value = state[kind]; el.style.setProperty("--v", state[kind] + "%"); el.oninput = () => { el.style.setProperty("--v", el.value + "%"); FM.setLevel(kind, +el.value); }; };
  sl($("#master"), "master"); sl($("#bed"), "bed");
  FM.meter($("#meter")); FM.clock($("#clk"));
  setInterval(() => { $("#dbV").textContent = $("#meter .db").textContent.replace(" dB", ""); }, 150);

  let lastLive = -1;
  FM.onChange((s) => {
    const live = PROGRAM[s.liveIdx], nx = PROGRAM[FM.nextIdx()];
    const mode = s.standby ? "standby" : !s.playing ? "off" : s.paused ? "paused" : "live";
    $("#lamp").className = "chip " + mode;
    $("#lamp").innerHTML = { live: "<i></i>В ЭФИРЕ", paused: "❚❚ ПАУЗА", standby: "▣ ЗАСТАВКА", off: "■ СТОП" }[mode];
    $("#nowN").textContent = live ? `${live.n} · ${live.nom}` : ""; $("#nowT").textContent = live ? live.title : "—"; $("#nowS").textContent = live ? live.sub : "";
    const rem = live ? live.dur - s.elapsed : 0;
    $("#el").textContent = mmss(s.elapsed); $("#rem").textContent = "−" + mmss(rem); $("#nowc").classList.toggle("low", rem <= 30);
    $("#pr").style.width = live ? (s.elapsed / live.dur) * 100 + "%" : "0";
    $("#pgm").classList.toggle("on", mode === "live"); $("#pgm").classList.toggle("standby", s.standby);
    $("#pgmImg").src = live ? cover(live) : ""; $("#pgmCap").innerHTML = live ? `${live.n} ${live.title}<span>${live.sub}</span>` : "";
    $("#pgmTc").textContent = mmss(s.elapsed) + " / " + mmss(live ? live.dur : 0);
    $("#pvwImg").src = nx ? cover(nx) : ""; $("#pvwCap").innerHTML = nx ? `${nx.n} ${nx.title}<span>${nx.sub}</span>` : "Конец программы"; $("#pvwD").textContent = nx ? mmss(nx.dur) : "";
    $("#mV").textContent = s.master + "%"; $("#bV").textContent = s.bed + "%";
    $("#pos").textContent = `${s.liveIdx + 1} из ${PROGRAM.length}`;
    document.querySelector(".tb.play").classList.toggle("on", mode === "live");
    document.querySelector(".tb.pause").classList.toggle("on", s.paused);
    document.querySelector(".tb.standby").classList.toggle("on", s.standby);
    if (lastLive !== s.liveIdx) { lastLive = s.liveIdx; renderTl(); $("#toLive").click(); }
    else { const f = document.querySelector(".it.live .fg"); if (f && live) f.style.strokeDashoffset = C * (1 - s.elapsed / live.dur); }
  });

  // ---------- клавиши ----------
  const keys = {
    Space: () => FM.transport(state.playing && !state.paused ? "pause" : "play"),
    KeyP: () => FM.transport("pause"), KeyN: () => FM.transport("next"), "shift+KeyS": () => FM.transport("stop"), KeyB: () => FM.transport("standby"),
    "ctrl+Backslash": () => $("#bSide").click(), F11: () => $("#bFocus").click(),
  };
  PANELS.forEach((p) => (keys[p.key] = () => toggle(p.id)));
  FM.QUICK.forEach((q) => (keys["Key" + q.key] = () => FM.toast(q.icon + " " + q.label + " — только макет")));
  FM.hotkeys(keys);

  render();
})();
</script>
</body>
</html>
